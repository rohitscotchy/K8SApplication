name: CI/CD Pipeline with vind

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/testwbapp

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
        run: |
          python -m pytest test/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build_push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Verify Docker image
        run: |
          docker image ls
          docker inspect "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

  deploy_vind:
    name: Deploy to vind Kubernetes
    needs: build_push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create vind Kubernetes cluster
        uses: loft-sh/setup-vind@v1
        with:
          name: testwbapp-cicd

      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes -o wide
          kubectl get namespaces
          kubectl get pods -A

      - name: Prepare Kubernetes manifest
        run: |
          sed -i "s|\${IMAGE_TAG}|${GITHUB_SHA}|g" k8s/deployment.yml
          sed -i "s|YOUR_DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/deployment.yml

          echo "Deployment manifest:"
          cat k8s/deployment.yml

      - name: Deploy application
        run: |
          kubectl apply -f k8s/

      - name: Wait for Kubernetes deployment
        run: |
          kubectl rollout status \
            deployment/testwbapp \
            --timeout=180s

      - name: Verify Kubernetes resources
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide

          echo "=== Pods ==="
          kubectl get pods -o wide

          echo "=== Deployment ==="
          kubectl get deployment testwbapp

          echo "=== Services ==="
          kubectl get services

      - name: Show deployment details on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs deployment/testwbapp --all-containers=true || true
          kubectl get events --sort-by=.lastTimestamp

      - name: Run Kubernetes smoke test
        run: |
          kubectl run smoke-test \
            --image=curlimages/curl:latest \
            --restart=Never \
            --rm \
            -i \
            --timeout=120s \
            -- \
            curl -f http://testwbapp:8000/health

      - name: Kubernetes deployment successful
        run: |
          echo "=========================================="
          echo " vind Kubernetes deployment successful"
          echo "=========================================="