apiVersion: apps/v1
kind: Deployment

metadata:
  name: testwbapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: testwbapp

  template:
    metadata:
      labels:
        app: testwbapp

    spec:
      containers:
        - name: testwbapp

          image: YOUR_DOCKERHUB_USERNAME/testwbapp:${IMAGE_TAG}

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"